# Статика двойника + прокси на API. Держит три вида трафика: обычные запросы,
# WebSocket (/api/scada/stream, /api/simulation/.../stream) и SSE (/api/live).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Импорт выгрузок MES/1С: backend ограничивает файл 10 МБ (config.MAX_UPLOAD), берём с запасом,
    # чтобы ошибку показало приложение, а не nginx.
    client_max_body_size 12m;

    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    # GLB-модели и JPG уже сжаты (meshopt) — повторное сжатие только греет процессор
    gzip_types         text/css text/plain application/javascript application/json image/svg+xml font/ttf;

    location /api/ {
        # Имя сервиса разрешаем через DNS Docker на каждом запросе: после перезапуска
        # контейнера API его адрес меняется, а nginx закешировал бы старый при старте.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Поток значений SCADA должен идти к браузеру сразу, без накопления в буфере
        proxy_buffering    off;
        proxy_cache        off;
        # Долгоживущие соединения: WebSocket телеметрии и SSE прогресса импорта
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Имена файлов сборки содержат хеш, GLB-модели и шрифты — тоже: кешируем надолго.
    # Один add_header вместо expires: иначе в ответе два разных Cache-Control.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /models/ {
        add_header Cache-Control "public, max-age=2592000";
    }
    # Перечень моделей имени с хешем не имеет: после замены GLB он должен обновиться сразу
    location = /models/manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Страницы кешировать нельзя: иначе после деплоя браузер тянет старые ссылки на assets
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /hmi.html   { add_header Cache-Control "no-store"; }
    location = /admin.html { add_header Cache-Control "no-store"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
